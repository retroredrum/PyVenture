name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest -m "not gui"

      - name: GUI tests (headless)
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy pytest -m gui

      - name: Validate example projects
        run: |
          python -m pyventure validate examples/mini-game/game.yaml
          python -m pyventure validate examples/legacy-game/game.yaml
